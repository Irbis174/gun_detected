[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "python-dotenv",
    "platformdirs",
    "numpy<2",
    "pillow",
    "pycocotools",
    "openmim",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
    "setuptools<82",
    "dotenv>=0.9.9",
    "mpmath>=1.3",
    "ultralytics>=8,<9",
    "lapx>=0.9.4",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

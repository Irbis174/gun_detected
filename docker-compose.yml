services:
  postgres:
    image: postgres:17
    container_name: diploma-postgres
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d diploma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
